rvm: true

builds:
  ruby_2_7:
    name: Ruby 2.7.8
    paths:
      - lib/**
      - spec/**
      - gemfiles/**
      - Gemfile
      - Gemfile.lock
      - baza_models.gemspec
      - Rakefile
      - Appraisals
      - VERSION
      - .ruby-version
      - .github/**
      - peak_flow.yml
      - tensorbuzz.yml
      - "!README.md"
      - "!LICENSE.txt"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_2.gemfile
      RUBY_VERSION: 2.7.8
    script:
      - bundle exec appraisal "ruby 2" rspec

  ruby_3_0:
